[package]
name = "sshportfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
russh = "0.64.1"
ratatui = "0.30.2"
tokio = {version = "1.53.1", features = ["full"]}
anyhow = "1.0.104"
ssh-key = "0.7.0-rc.11"
tui-big-text = "0.8.8"
reqwest = {version = "0.13.4",features = ["json"]}
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"
textwrap = "0.16"
# Blog pages are fetched as CommonMark from blog.lsnnt.dev/<slug>.md and
# rendered into the terminal, so we parse markdown ourselves.
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-width = "0.2"
log = "0.4"
env_logger = "0.11"
